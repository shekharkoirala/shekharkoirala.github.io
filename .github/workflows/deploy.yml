# Builds the Eleventy site and deploys it to GitHub Pages on every push to the
# default branch. This is REQUIRED because the repo stores SOURCE (not built
# HTML) and `_site/` is gitignored — the build must happen in CI.
#
# ONE-TIME SETUP (do this once in the GitHub UI after pushing):
#   Repo → Settings → Pages → "Build and deployment" → Source → "GitHub Actions"
#
# This is a <user>.github.io site served at the domain root, so we build WITHOUT
# a pathPrefix (plain `npm run build`).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Eleventy .cache
        uses: actions/cache@v4
        with:
          path: ./.cache
          key: ${{ runner.os }}-eleventy-fetch-cache

      - run: npm ci
      - run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
